<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderGo Travels - Practical 6</title>
    
    <style>
        /* =====================================================
           Embedded CSS Styles
           ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #222;
            transition: 0.3s;
        }

        header {
            background-color: #0066cc;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        main {
            width: 90%;
            max-width: 1100px;
            margin: auto;
        }

        section {
            margin: 30px 0;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ccc;
        }

        .hero {
            text-align: center;
        }

        .hero h2 {
            margin-bottom: 10px;
        }

        #offer {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffe082;
            font-weight: bold;
            border-radius: 8px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            background-color: #0066cc;
            color: white;
            cursor: pointer;
            margin: 10px 0;
        }

        button:hover {
            background-color: #004c99;
        }

        #packageContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .package {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background-color: #fafafa;
        }

        .package h3 {
            color: #0066cc;
            margin-bottom: 10px;
        }

        .package p {
            margin: 8px 0;
        }

        select {
            padding: 10px;
            width: 200px;
            border-radius: 5px;
            border: 1px solid #aaa;
        }

        .dark {
            background-color: #222;
            color: white;
        }

        .dark section {
            background-color: #333;
            color: white;
        }

        .dark .package {
            background-color: #444;
        }

        footer {
            text-align: center;
            background-color: #0066cc;
            color: white;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            nav a {
                display: block;
                margin: 8px;
            }

            main {
                width: 95%;
            }

            select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>🌍 WanderGo Travels</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#packages">Packages</a>
            <a href="#preferences">Preferences</a>
        </nav>
    </header>

    <!-- Main Section -->
    <main>
        <!-- Home -->
        <section id="home" class="hero">
            <h2>Explore the World with WanderGo</h2>
            <p>Discover amazing destinations and exciting travel packages.</p>
            <div id="offer">Loading special offer...</div>
        </section>

        <!-- Packages -->
        <section id="packages">
            <h2>Available Travel Packages</h2>
            <button onclick="loadPackages()">Load Travel Packages</button>
            <p id="loading"></p>
            <div id="packageContainer"></div>
        </section>

        <!-- Preferences -->
        <section id="preferences">
            <h2>User Preferences</h2>
            <label>Select Destination:</label>
            <select id="destination">
                <option value="">-- Select Destination --</option>
                <option value="Goa">Goa</option>
                <option value="Manali">Manali</option>
                <option value="Jaipur">Jaipur</option>
                <option value="Kerala">Kerala</option>
            </select>
            <br><br>
            <label>Select Theme:</label>
            <select id="theme">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
            <br><br>
            <button onclick="savePreferences()">Save Preferences</button>
            <p id="preferenceMessage"></p>
        </section>

        <!-- Session Information -->
        <section>
            <h2>Session Information</h2>
            <p id="sessionInfo"></p>
            <button onclick="startSession()">Start Session</button>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 WanderGo Travels Pvt. Ltd.</p>
    </footer>

    <script>
        // =====================================================
        // Embedded JSON data array (simulating packages.json)
        // =====================================================
        const travelPackagesData = [
            {
                "id": 1,
                "destination": "Goa",
                "duration": "4 Days / 3 Nights",
                "price": 15000,
                "description": "Enjoy beautiful beaches, nightlife and water sports."
            },
            {
                "id": 2,
                "destination": "Manali",
                "duration": "5 Days / 4 Nights",
                "price": 18000,
                "description": "Experience mountains, snow and beautiful valleys."
            },
            {
                "id": 3,
                "destination": "Jaipur",
                "duration": "3 Days / 2 Nights",
                "price": 12000,
                "description": "Explore forts, palaces and the rich culture of Rajasthan."
            },
            {
                "id": 4,
                "destination": "Kerala",
                "duration": "5 Days / 4 Nights",
                "price": 20000,
                "description": "Discover backwaters, beaches and natural beauty."
            }
        ];

        // =====================================================
        // 1. setTimeout() - Display promotional message
        // =====================================================
        setTimeout(function () {
            const offerEl = document.getElementById("offer");
            if (offerEl) {
                offerEl.innerHTML = "🎉 Special Offer: Get 20% OFF on selected travel packages!";
            }
        }, 3000);

        // =====================================================
        // 2. setInterval() - Dynamically update promotional message
        // =====================================================
        const offers = [
            "🎉 Get 20% OFF on Goa Packages!",
            "🏔️ Special Manali Package Available!",
            "🌴 Explore Kerala with WanderGo!",
            "🏰 Discover Jaipur at an amazing price!"
        ];
        let offerIndex = 0;

        setInterval(function () {
            const offerEl = document.getElementById("offer");
            if (offerEl && offerIndex < offers.length) {
                offerEl.innerHTML = offers[offerIndex];
                offerIndex++;
                if (offerIndex >= offers.length) {
                    offerIndex = 0;
                }
            }
        }, 5000);

        // =====================================================
        // 3. Callback Function Demonstration
        // =====================================================
        function performTask(taskName, callback) {
            console.log("Starting task: " + taskName);
            setTimeout(function () {
                console.log(taskName + " completed.");
                callback();
            }, 2000);
        }

        function firstTaskCompleted() {
            console.log("First asynchronous task completed.");
            performTask("Second Task", function () {
                console.log("All asynchronous tasks completed.");
            });
        }

        performTask("First Task", firstTaskCompleted);

        // =====================================================
        // 4. Fetch API / Local Array Simulation - Retrieve Data
        // =====================================================
        function loadPackages() {
            const container = document.getElementById("packageContainer");
            const loading = document.getElementById("loading");

            loading.innerHTML = "Loading packages...";
            container.innerHTML = "";

            setTimeout(() => {
                try {
                    const packages = travelPackagesData;
                    loading.innerHTML = "Packages loaded successfully!";
                    displayPackages(packages);
                } catch (error) {
                    loading.innerHTML = "Error loading travel packages: " + error.message;
                }
            }, 1000);
        }

        // =====================================================
        // 5. Display JSON data dynamically
        // =====================================================
        function displayPackages(packages) {
            const container = document.getElementById("packageContainer");
            container.innerHTML = "";

            packages.forEach(function (pkg) {
                const card = document.createElement("div");
                card.className = "package";
                card.innerHTML = `
                    <h3>${pkg.destination}</h3>
                    <p><strong>Duration:</strong> ${pkg.duration}</p>
                    <p><strong>Price:</strong> ₹${pkg.price}</p>
                    <p>${pkg.description}</p>
                    <button onclick="selectDestination('${pkg.destination}')">Select</button>
                `;
                container.appendChild(card);
            });
        }

        // =====================================================
        // 6. Select destination
        // =====================================================
        function selectDestination(destination) {
            document.getElementById("destination").value = destination;
            localStorage.setItem("selectedDestination", destination);
            document.getElementById("preferenceMessage").innerHTML = "Selected destination: " + destination;
        }

        // =====================================================
        // 7. Local Storage - Save Preferences
        // =====================================================
        function savePreferences() {
            const destination = document.getElementById("destination").value;
            const theme = document.getElementById("theme").value;

            localStorage.setItem("selectedDestination", destination);
            localStorage.setItem("preferredTheme", theme);

            applyTheme(theme);
            document.getElementById("preferenceMessage").innerHTML = "✅ Preferences saved successfully.";
        }

        // =====================================================
        // 8. Retrieve Local Storage data
        // =====================================================
        function loadPreferences() {
            const savedDestination = localStorage.getItem("selectedDestination");
            const savedTheme = localStorage.getItem("preferredTheme");

            if (savedDestination) {
                document.getElementById("destination").value = savedDestination;
            }

            if (savedTheme) {
                document.getElementById("theme").value = savedTheme;
                applyTheme(savedTheme);
            }
        }

        // Apply selected theme
        function applyTheme(theme) {
            if (theme === "dark") {
                document.body.classList.add("dark");
            } else {
                document.body.classList.remove("dark");
            }
        }

        // =====================================================
        // 9. Session Storage
        // =====================================================
        function startSession() {
            const sessionId = "WG-" + Math.floor(Math.random() * 100000);
            sessionStorage.setItem("sessionId", sessionId);
            document.getElementById("sessionInfo").innerHTML = "Session started. Session ID: " + sessionId;
        }

        function loadSession() {
            const sessionId = sessionStorage.getItem("sessionId");
            if (sessionId) {
                document.getElementById("sessionInfo").innerHTML = "Active Session ID: " + sessionId;
            } else {
                document.getElementById("sessionInfo").innerHTML = "No active session.";
            }
        }

        // =====================================================
        // Execute when webpage loads
        // =====================================================
        window.addEventListener("load", function () {
            loadPreferences();
            loadSession();
        });
    </script>
</body>

</html>
