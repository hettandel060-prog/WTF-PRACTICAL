<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickShop Online Marketplace </title>
    <style>
        :root {
            --primary-color: #007bff;
            --success-color: #28a745;
            --danger-color: #dc3545;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }

        header p {
            color: #7f8c8d;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-top: 4px solid var(--primary-color);
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.25rem;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        button {
            padding: 10px 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        .status-msg {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            display: none;
        }

        .status-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        /* Product Grid Display */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            max-height: 100px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        .product-card h4 {
            font-size: 0.95rem;
            margin: 0 0 8px 0;
            color: #333;
        }

        .product-card p {
            font-weight: bold;
            color: var(--success-color);
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>QuickShop Online Marketplace</h1>
            
        </header>

        <!-- Section 1: GET Request (Retrieve Data) -->
        <div class="card">
            <h2>1. Retrieve Products (GET Request)</h2>
            <p>Fetch real-time product catalogs dynamically from a public REST API.</p>
            <div class="btn-group">
                <button onclick="fetchProducts()">Load Products (GET)</button>
            </div>
            <div id="get-status" class="status-msg"></div>
            <div id="product-container" class="product-grid">
                <!-- Dynamic cards load here -->
            </div>
        </div>

        <!-- Section 2: POST Request (Send Data) -->
        <div class="card" style="border-color: var(--success-color);">
            <h2>2. Add New Product (POST Request)</h2>
            <p>Send JSON-formatted product data to the server API endpoint.</p>
            <form id="post-form" onsubmit="submitProduct(event)">
                <div class="form-row">
                    <input type="text" id="prod-title" placeholder="Product Title" required>
                    <input type="number" id="prod-price" placeholder="Price ($)" step="0.01" required>
                </div>
                <div class="form-row">
                    <input type="text" id="prod-cat" placeholder="Category" required>
                    <button type="submit" style="background-color: var(--success-color);">Submit Product (POST)</button>
                </div>
            </form>
            <div id="post-status" class="status-msg"></div>
        </div>
    </div>

    <script>
        // Task 3, 4, 5, 7, 8: Consume REST API using GET, parse JSON, and handle errors
        async function fetchProducts() {
            const statusDiv = document.getElementById('get-status');
            const container = document.getElementById('product-container');
            
            statusDiv.className = 'status-msg';
            statusDiv.textContent = 'Loading products from API...';
            statusDiv.style.display = 'block';
            container.innerHTML = '';

            try {
                // Sending GET request to FakeStoreAPI
                const response = await fetch('https://fakestoreapi.com/products?limit=4');
                
                // Check if HTTP response is successful (Status 200-299)
                if (!response.ok) {
                    throw new Error(`HTTP Error! Status: ${response.status}`);
                }

                // Parse incoming JSON data
                const products = await response.json();

                statusDiv.className = 'status-msg status-success';
                statusDiv.textContent = 'Successfully retrieved product data from REST API!';

                // Dynamically render product cards
                products.forEach(product => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <div>
                            <img src="${product.image}" alt="${product.title}">
                            <h4>${product.title.substring(0, 35)}...</h4>
                        </div>
                        <p>$${product.price}</p>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                // Task 7: Error handling for failed requests
                statusDiv.className = 'status-msg status-error';
                statusDiv.textContent = 'Failed to fetch products: ' + error.message;
            }
        }

        // Task 3, 6, 8: Send JSON data via POST request and display feedback
        async function submitProduct(event) {
            event.preventDefault();
            const statusDiv = document.getElementById('post-status');

            const title = document.getElementById('prod-title').value;
            const price = document.getElementById('prod-price').value;
            const category = document.getElementById('prod-cat').value;

            const newProduct = {
                title: title,
                price: parseFloat(price),
                description: "QuickShop test product upload",
                image: "https://via.placeholder.com/150",
                category: category
            };

            statusDiv.className = 'status-msg';
            statusDiv.textContent = 'Sending JSON data to server...';
            statusDiv.style.display = 'block';

            try {
                // Sending POST request with JSON payload
                const response = await fetch('https://fakestoreapi.com/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newProduct)
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const result = await response.json();

                statusDiv.className = 'status-msg status-success';
                statusDiv.textContent = `Success! Product added with Server ID: ${result.id}`;
                document.getElementById('post-form').reset();

            } catch (error) {
                statusDiv.className = 'status-msg status-error';
                statusDiv.textContent = 'POST request failed: ' + error.message;
            }
        }
    </script>
</body>
</html>
